<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Acceso privado · ONE SHOT</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #e9e7e1; color: #171717; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 20px; }
      main { width: min(100%, 520px); padding: clamp(28px, 7vw, 60px); background: #f8f7f3; border: 1px solid #c5c2bb; }
      .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #59636b; }
      h1 { margin: 20px 0 10px; font-size: clamp(42px, 11vw, 68px); letter-spacing: -.06em; line-height: .95; }
      p { line-height: 1.55; }
      label { display: block; margin: 28px 0 8px; font-size: 13px; letter-spacing: .12em; }
      input, button { width: 100%; min-height: 52px; padding: 12px 14px; border: 1px solid #aaa79f; font: inherit; }
      input { background: #fff; }
      button { margin-top: 12px; border-color: #171717; background: #171717; color: #fff; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 3px solid #527564; outline-offset: 2px; }
      #message { min-height: 1.5em; color: #8e2d20; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ONE SHOT / acceso privado</p>
      <h1>Studio.</h1>
      <p>Introduce el código temporal que aparece en la terminal del ordenador donde está abierto el Studio.</p>
      <form id="login-form">
        <label for="access-code">CÓDIGO DE ACCESO</label>
        <input id="access-code" name="code" type="password" autocomplete="one-time-code" required autofocus />
        <button type="submit">Entrar al Studio</button>
        <p id="message" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
